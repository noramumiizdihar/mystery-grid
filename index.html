<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#151b24"><link rel="manifest" href="manifest.json"><title>Mystery Grid</title><style>*{box-sizing:border-box}body{margin:auto;max-width:850px;padding:18px;background:#151b24;color:#eee5d4;font:16px system-ui}h1,h2{font-family:Georgia;color:#e6bd80}button,select{background:#293645;color:#fff;border:1px solid #526071;border-radius:8px;padding:10px;font:inherit;cursor:pointer}button:disabled{opacity:.5}section{background:#202a36;padding:14px;border-radius:12px;margin:14px 0}#levels{display:grid;grid-template-columns:repeat(auto-fit,minmax(48px,1fr));gap:6px}.board{overflow:auto}table{border-collapse:collapse;margin:10px 0;width:100%;font-size:12px}td,th{border:1px solid #495463;padding:4px;text-align:center}td button{width:100%;min-width:34px;padding:8px 3px} .yes{background:#24684e}.no{background:#703e40}small{color:#b9c1ca}li{margin:9px 0;cursor:pointer}.done{text-decoration:line-through;opacity:.5}#status{color:#e6bd80} .tools{display:flex;flex-wrap:wrap;gap:7px}</style></head><body><h1> MYSTERY GRID</h1><small>DETECTIVE FILES • 200 CASES</small><section><label>Difficulty <select id="diff"><option>Easy</option><option>Medium</option><option>Hard</option><option>Expert</option></select></label><p id="progress"></p><div id="levels"></div></section><section><h2 id="caseTitle"></h2><p id="story"></p><small>Tap a cell to cycle blank → excluded (×) → confirmed (✓). Match every suspect to one item in each category. Cross out clues as you use them.</small><div id="boards"></div></section><section><h2>Evidence</h2><ol id="clues"></ol></section><section class="tools"><button id="check">Check case</button><button id="hint">Hint</button><button id="undo">Undo</button><button id="reset">Reset</button><button id="next">Next case</button><button id="install" hidden>Install app</button><p id="status" role="status"></p></section><script src="game.js"></script></body></html>
