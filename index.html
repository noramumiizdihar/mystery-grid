<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#151b24"><link rel="manifest" href="manifest.json"><title>Mystery Grid</title><style>*{box-sizing:border-box}body{margin:auto;max-width:850px;padding:18px;background:#151b24;color:#eee5d4;font:16px system-ui}h1,h2{font-family:Georgia;color:#e6bd80}button,select{background:#293645;color:#fff;border:1px solid #526071;border-radius:8px;padding:10px;font:inherit;cursor:pointer}button:disabled{opacity:.5}section{background:#202a36;padding:14px;border-radius:12px;margin:14px 0}#levels{display:grid;grid-template-columns:repeat(auto-fit,minmax(48px,1fr));gap:6px}.board{overflow:auto}table{border-collapse:collapse;margin:10px 0;width:100%;font-size:12px}td,th{border:1px solid #495463;padding:4px;text-align:center}td button{width:100%;min-width:34px;padding:8px 3px} .yes{background:#24684e}.no{background:#703e40}small{color:#b9c1ca}li{margin:9px 0;cursor:pointer}.done{text-decoration:line-through;opacity:.5}#status{color:#e6bd80} .tools{display:flex;flex-wrap:wrap;gap:7px}body{background:radial-gradient(ellipse at top,#29251f,#101012 65%);color:#e9dfca;padding:12px}h1{letter-spacing:.18em;text-align:center;font-size:clamp(25px,6vw,42px);margin-bottom:4px}body>small{display:block;text-align:center;letter-spacing:.18em;color:#bba47b}section{background:#19191c;border:1px solid #51432c;box-shadow:0 8px 24px #0005;padding:12px}button,select{background:#242326;border-color:#51432c;color:#ead5ac}#levels{grid-template-columns:repeat(10,minmax(0,1fr));gap:4px}#levels button{padding:8px 0;font-size:12px}table{table-layout:fixed}td,th{border-color:#51432c;padding:2px}td button{min-width:0;padding:8px 0;font-size:18px}.yes{background:#24513f}.no{background:#542e32}caption{color:#d9b879;text-transform:uppercase;letter-spacing:.14em;padding:8px}svg.item{width:28px;height:28px;max-width:100%;vertical-align:middle;color:#e2c18a}#clues{list-style:none;padding:0}#clues li{border:1px solid #51432c;border-radius:10px;padding:10px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}#clues li.done{opacity:.45;text-decoration:none}#clues li.done .evidence-icons{text-decoration:line-through}.evidence-icons{display:flex;align-items:center;gap:12px;flex:1}.clue-text{flex-basis:100%;font-size:13px;color:#d4c7af}.tools button{flex:1}#status{flex-basis:100%} .legend{font-size:12px;color:#bba47b}#boards{overflow:auto}.triangle{width:max-content;table-layout:fixed}.triangle td{width:36px;min-width:36px;height:36px;padding:0}.triangle td button{height:35px;width:35px;border:0;border-radius:0;padding:0}.triangle .void{border:0;background:transparent}.triangle .edge{border-left:2px solid #d9b879}.triangle .top{border-top:2px solid #d9b879}.roster{display:flex;flex-wrap:wrap;gap:8px}.roster span{flex:1;min-width:75px;text-align:center;background:#242326;padding:8px;border-radius:8px}.roster small{display:block;font-size:11px}h3{font-size:13px;color:#d9b879}#accuse label{display:flex;flex-direction:column;gap:4px;margin:8px 0}#number{width:100px;background:#242326;color:#ead5ac;border:1px solid #51432c;border-radius:8px;padding:8px}.selected{outline:2px solid #d9b879}#clues li.done{text-decoration:line-through}#clues input{accent-color:#d9b879}#levels{margin-top:10px}</style></head><body><h1> MYSTERY GRID</h1><small>DETECTIVE FILES • 4,000 CASES • VOL. III</small><section><label>Difficulty <select id="diff"><option>Easy</option><option>Medium</option><option>Hard</option><option>Expert</option></select></label><p id="progress"></p><div class="tools"><input id="number" type="number" min="1" max="1000" value="1" aria-label="Level number"><button id="jump">Go to case</button></div><div id="levels"></div></section><section><h2 id="caseTitle"></h2><p id="story"></p><small>Tap a cell to cycle blank → excluded (×) → confirmed (✓). Match every suspect to one item in each category. Cross out clues as you use them.</small><div id="roster"></div></section><section><h2>Evidence</h2><ol id="clues"></ol></section><section><h2>Deduction Grid</h2><label><input type="checkbox" id="auto"> Auto-elimination</label><p><small>Swipe sideways on larger grids.</small></p><div id="boards"></div></section><section><h2>Final Accusation</h2><div id="accuse"></div></section><section class="tools"><button id="check">Check case</button><button id="hint">Hint</button><button id="undo">Undo</button><button id="reset">Reset</button><button id="next">Next case</button><button id="install" hidden>Install app</button><p id="status" role="status"></p></section><script src="puzzles-v3.js"></script><script src="game-v3.js"></script></body></html>
