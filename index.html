<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#392637"><link rel="manifest" href="manifest.json"><title>Mystery Grid</title><link rel="stylesheet" href="cozy.css"><link rel="stylesheet" href="mockup-art.css"></head><body><main>
<section id="home" class="screen home"><h1>Mystery Grid</h1><b class="ribbon">DETECTIVE FILES</b><p>4,000 MYSTERIES</p><div id="hero"></div><nav><button data-go="difficulty">▶ Play</button><button id="continue">▣ Continue</button><button data-go="difficulty">▦ Cases</button><button data-go="stats">▥ Statistics</button><button data-go="settings">⚙ Settings</button></nav></section>
<section id="difficulty" class="screen" hidden><header><button data-go="home">←</button><h2>Select Difficulty</h2></header><div id="choices"></div></section>
<section id="picker" class="screen" hidden><header><button data-go="difficulty">←</button><h2 id="pickTitle">Easy Cases</h2></header><select id="diff" hidden><option>Easy</option><option>Medium</option><option>Hard</option><option>Expert</option></select><p id="progress"></p><div id="levels"></div><div class="tools"><button id="prevPage">‹</button><span id="page"></span><button id="nextPage">›</button></div><div class="tools"><input id="number" type="number" min="1" max="1000" value="1" aria-label="Case number"><button id="jump">Go to case</button></div></section>
<section id="case" class="screen" hidden><header><button data-go="picker">←</button><h2 id="caseTitle"></h2></header><p id="story"></p><div id="roster"></div><button class="primary" data-go="play" data-tab="evidence">View Evidence →</button></section>
<section id="play" class="screen" hidden><header><button data-go="case">←</button><h2 id="playTitle">Case</h2><span id="timer">00:00</span></header><nav class="tabs"><button data-tab="grid">▦ Grid</button><button data-tab="evidence">▤ Evidence</button><button data-tab="notes">▧ Notes</button></nav><div id="grid" class="panel"><div class="tools"><button id="smaller">−</button><button id="larger">+</button><small>Swipe to explore</small></div><div id="boards"></div><p class="legend">✓ Confirmed · × Cannot be · • Unknown</p></div><div id="evidence" class="panel" hidden><h2>Clues &amp; Evidence</h2><p id="medical"></p><ol id="clues"></ol></div><div id="notes" class="panel" hidden><h2>Detective Notes</h2><textarea id="notepad" placeholder="Write your deductions..."></textarea></div><footer><div class="tools"><button id="undo">↶ Undo</button><button id="hint">💡 Hint</button><button id="reset">↻ Reset</button></div><button class="primary red" data-go="accusation">⚖ Make Your Accusation</button><p id="status" role="status"></p></footer></section>
<section id="accusation" class="screen" hidden><header><button data-go="play">←</button><h2>Final Accusation</h2></header><div id="accuse"></div><button id="check" class="primary red">Submit accusation</button><p id="verdict" role="status"></p><button id="next">Next case →</button></section>
<section id="settings" class="screen" hidden><header><button data-go="home">←</button><h2>Settings</h2></header><label><input type="checkbox" id="auto"> Auto-elimination</label><p><button id="install" hidden>Install app</button></p></section><section id="stats" class="screen" hidden><header><button data-go="home">←</button><h2>Statistics</h2></header><div id="statBody"></div></section></main><script src="puzzles-v3.js"></script><script src="game-v4.js"></script></body></html>
