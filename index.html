<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#f8f9ff"><link rel="manifest" href="manifest.json"><title>Mystery Grid</title><link rel="stylesheet" href="arcade.css"></head><body><main>
<section id="home" class="screen home">
  <div class="wordmark"><span class="brand-mark" aria-hidden="true"></span>Mystery Grid</div>
  <div class="home-hero">
    <h1>Mystery<br>Grid</h1>
    <div class="puzzle-art" aria-hidden="true"><span></span><span>✓</span><span></span><span></span><span></span><span>×</span></div>
    <div class="home-actions">
      <button class="play-button" data-go="picker">Play</button>
      <button id="continue">Continue</button>
    </div>
  </div>
  <nav class="home-nav" aria-label="Main menu">
    <button data-go="picker"><span aria-hidden="true">▦</span>Cases</button>
    <button data-go="stats"><span aria-hidden="true">▥</span>Stats</button>
    <button data-go="settings"><span aria-hidden="true">⚙</span>Settings</button>
  </nav>
</section>
<section id="picker" class="screen" hidden><header><button data-go="home" aria-label="Back">←</button><h2 id="pickTitle">Choose a case</h2></header><div id="choices" role="group" aria-label="Difficulty"></div><select id="diff" hidden><option>Easy</option><option>Medium</option><option>Hard</option><option>Expert</option></select><p id="progress"></p><div id="levels"></div><div class="tools"><button id="prevPage" aria-label="Previous page">‹</button><span id="page"></span><button id="nextPage" aria-label="Next page">›</button></div><div class="tools"><input id="number" type="number" min="1" max="1000" value="1" aria-label="Case number"><button id="jump">Go to case</button></div></section>
<section id="case" class="screen" hidden><header><button data-go="picker" aria-label="Back">←</button><h2 id="caseTitle"></h2></header><p id="story"></p><div id="roster"></div><button class="primary" data-go="play" data-tab="evidence">View Evidence →</button></section>
<section id="play" class="screen" hidden><header><button data-go="case" aria-label="Back">←</button><h2 id="playTitle">Case</h2><span id="timer">00:00</span></header><nav class="tabs"><button data-tab="grid">Grid</button><button data-tab="evidence">Evidence</button><button data-tab="notes">Notes</button></nav><div id="grid" class="panel"><div id="boards" tabindex="0" role="region" aria-label="Scrollable logic grid"></div><div class="tools grid-tools"><button id="smaller" aria-label="Decrease grid size">−</button><button id="larger" aria-label="Increase grid size">+</button><small>Swipe to explore</small></div><p class="legend">✓ Confirmed · × Cannot be · • Unknown</p></div><div id="evidence" class="panel" hidden><h2>Clues &amp; Evidence</h2><p id="medical"></p><ol id="clues"></ol></div><div id="notes" class="panel" hidden><h2>Detective Notes</h2><textarea id="notepad" aria-label="Detective notes" placeholder="Write your deductions..."></textarea></div><footer><div class="tools"><button id="undo">↶ Undo</button><button id="hint">💡 Hint</button><button id="reset">↻ Reset</button></div><button class="primary red" data-go="accusation">Make accusation</button><p id="status" role="status"></p></footer></section>
<section id="accusation" class="screen" hidden><header><button data-go="play" aria-label="Back">←</button><h2>Final Accusation</h2></header><div id="accuse"></div><button id="check" class="primary red">Submit accusation</button><p id="verdict" role="status"></p><button id="next">Next case →</button></section>
<section id="settings" class="screen" hidden><header><button data-go="home" aria-label="Back">←</button><h2>Settings</h2></header><label><input type="checkbox" id="auto"> Auto-elimination</label><p><button id="install" hidden>Install app</button></p></section><section id="stats" class="screen" hidden><header><button data-go="home" aria-label="Back">←</button><h2>Statistics</h2></header><div id="statBody"></div></section></main><script src="puzzles-v3.js"></script><script src="game-v4.js"></script></body></html>
